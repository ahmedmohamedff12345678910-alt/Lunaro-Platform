services:
  postgres:
    image: postgres:17-alpine
    container_name: lunaro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lunaro
      POSTGRES_USER: lunaro
      POSTGRES_PASSWORD: lunaro_local_password
    ports:
      - "5432:5432"
    volumes:
      - lunaro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunaro -d lunaro"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  lunaro_pgdata:
